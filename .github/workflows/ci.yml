name: Continuous Integration

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    name: 'Test (Python ${{ matrix.python-version }})'
    # Pinned on purpose: ubuntu-latest moved to 26.04, which has no prebuilt
    # Python 3.9, and the 3.9 entry failed at setup-python.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12', '3.14']
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
        with:
          # Read-only job: keep GITHUB_TOKEN out of .git/config.
          persist-credentials: false

      - name: 'Setup Python'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 'Test'
        run: python -m unittest test_copy -v

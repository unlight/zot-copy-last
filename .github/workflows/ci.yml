name: CI

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    name: 'Test (Python ${{ matrix.python-version }})'
    # Pinned on purpose: ubuntu-latest moved to 26.04, which has no prebuilt
    # Python 3.9, and the 3.9 entry failed at setup-python.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12', '3.14']
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
        with:
          # Read-only job: keep GITHUB_TOKEN out of .git/config.
          persist-credentials: false

      - name: 'Setup Python'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 'Test'
        run: python -m unittest test_copy -v

  release:
    name: 'Changelog, tag, release'
    # needs: every matrix entry passed; the ref guard keeps pull requests out.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      # Overrides the read-only default: @semantic-release/git pushes the
      # changelog commit and the tag, @semantic-release/github opens the release.
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
        with:
          # semantic-release needs the full history and the existing tags.
          fetch-depth: 0

      - name: 'Setup Node'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 'Set git identity'
        # @semantic-release/git runs a bare `git commit`; the runner has no
        # identity, and git fails with "Author identity unknown" without one.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 'Install release tooling'
        # Local install is required: release.config.mjs imports
        # changelog-sentence-case, and npx --package does not expose its temp
        # modules to the config. --no-save keeps the checkout manifest-free.
        # The preset stays on 9: major 10 needs conventional-changelog-writer@9
        # and semantic-release 25 ships writer@8, so it dies in generateNotes
        # with "Missing helper". Bump both together.
        run: |
          npm install --no-save --no-package-lock \
            semantic-release@25 \
            @semantic-release/changelog@7 \
            @semantic-release/git@11 \
            @semantic-release/github@12 \
            conventional-changelog-conventionalcommits@9 \
            changelog-sentence-case@1

      - name: 'Release'
        # Majors are pinned above, patches flow.
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
